; Laravel scheduler — runs the every-minute health heartbeat, the 30-minute
; Shopify token rotation (without it access tokens expire and syncs return
; 401), stalled-checkout recovery and the daily prune. Install:
;   sudo cp deploy/supervisor/whatify-scheduler.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status whatify-scheduler
; Use this OR the cron entry in deploy/cron, never both.

[program:whatify-scheduler]
process_name=%(program_name)s
command=/usr/bin/php artisan schedule:work
directory=/var/www/waflow
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/log/whatify-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
