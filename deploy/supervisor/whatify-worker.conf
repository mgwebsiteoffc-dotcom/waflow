; Persistent queue worker — drains the database `jobs` table (webhooks,
; WhatsApp sends, reply handling). Install:
;   sudo cp deploy/supervisor/whatify-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status whatify-worker
; Adjust project path and user if your server differs.

[program:whatify-worker]
process_name=%(program_name)s
command=/usr/bin/php artisan queue:work database --sleep=3 --tries=3 --backoff=10 --timeout=120 --max-time=3600
directory=/var/www/waflow
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=130
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/whatify-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
